name: Save My Little Finance data

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Finance data JSON payload"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: finance-data-save
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write finance data
        env:
          FINANCE_PAYLOAD: ${{ inputs.payload }}
        run: python .github/scripts/save_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finance_data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update My Little Finance data"
            git push
          fi
